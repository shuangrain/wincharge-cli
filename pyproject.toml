[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wincharge-cli"
dynamic = ["version"]
description = "WinCharge 充電樁 CLI 控制工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[tool.hatch.version]
source = "vcs"

[project.scripts]
wincharge-cli = "wincharge.wincharge_cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "custom_components/wincharge",
]
include = [
    "wincharge_cli.py",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["BLE001", "E501"]
