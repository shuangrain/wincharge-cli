[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wincharge-cli"
version = "0.1.0"
description = "WinCharge 充電樁 CLI 控制工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
wincharge-cli = "wincharge_cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
include = [
    "wincharge_cli.py",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["BLE001", "E501"]
